<html lang="no" data-en-title="Books · Fredrik Udengen">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bøker · Fredrik Udengen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <meta name="description" content="Bøker · Fredrik Udengen" />
  <script src="lang.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="topbar">
      <a class="brand" href="index.html">Fredrik Udengen</a>
      <nav class="nav">
        <a href="index.html"><span lang="no">Om meg</span><span lang="en">About me</span></a>
        <a href="projects.html"><span lang="no">Prosjekter</span><span lang="en">Projects</span></a>
        <a href="filmer.html"><span lang="no">Filmer</span><span lang="en">Films</span></a>
        <a href="https://www.linkedin.com/in/fredrik-udengen-87272a143/" target="_blank" rel="noopener">LinkedIn</a>
        <a href="mailto:fredrikudengen@proton.me"><span lang="no">Kontakt</span><span lang="en">Contact</span></a>
      </nav>
    </div>

    <section class="page-hero reveal">
      <h1><span lang="no">Bøker</span><span lang="en">Books</span></h1>
      <p class="subtitle" lang="no">Noen bok-"anmeldelser" jeg har skrevet. Jeg jobber med å rettskrive de jeg har skrevet...</p>
      <p class="subtitle" lang="en">Some book "reviews" I've written. I'm working on proofreading the ones I've written...</p>
    </section>
  </header>

  <main class="content">
    <section class="review-grid" id="review-grid"></section>
  </main>

  <footer class="footer">
    <p>© <span id="year"></span> Fredrik Udengen</p>
  </footer>

  <script src="patterns.js"></script>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    function dateKey(entry) {
      if (!entry.dato) return -Infinity;
      var parts = entry.dato.split(".");
      if (parts.length !== 3) return -Infinity;
      var d = parseInt(parts[0], 10);
      var m = parseInt(parts[1], 10);
      var y = parseInt(parts[2], 10);
      if (!d || !m || !y) return -Infinity;
      return y * 10000 + m * 100 + d;
    }

    fetch("resources/meta.json")
      .then((r) => r.json())
      .then((meta) => {
        var books = meta.books || {};
        var grid = document.getElementById("review-grid");
        var slugs = Object.keys(books).sort(function (a, b) {
          return dateKey(books[b]) - dateKey(books[a]);
        });
        slugs.forEach(function (slug) {
          var entry = books[slug];
          var card = document.createElement("a");
          card.className = "review-card";
          card.href = "boker/" + slug + ".html";

          if (window.makePattern) {
            var thumb = document.createElement("div");
            thumb.className = "review-pattern";
            thumb.appendChild(makePattern(entry.title, slug, entry.moenster));
            card.appendChild(thumb);
          }

          var h2 = document.createElement("h2");
          h2.textContent = entry.title;
          card.appendChild(h2);

          if (entry.forfatter) {
            var p = document.createElement("p");
            p.className = "review-card-meta";
            p.textContent = entry.forfatter;
            card.appendChild(p);
          }

          if (entry.dato) {
            var pDato = document.createElement("p");
            pDato.className = "review-card-date";
            pDato.appendChild(siteLang.text("Skrevet " + entry.dato, "Written " + entry.dato));
            card.appendChild(pDato);
          }

          grid.appendChild(card);
        });
      })
      .catch(function () {
        document.getElementById("review-grid").innerHTML =
          '<p lang="no">Kunne ikke laste anmeldelser.</p><p lang="en">Could not load reviews.</p>';
      });
  </script>
  <script src="script.js"></script>
</body>
</html>
